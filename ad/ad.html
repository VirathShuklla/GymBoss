<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@700&display=block" rel="stylesheet">
<style>
  :root { --ink:#0A0712; --ink2:#160E2B; --purple:#7C3AED; --violet:#A78BFA; --lime:#C6FF3D; --white:#F7F5FF; --mint:#22C55E; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:var(--ink); overflow:hidden; }
  #stage { position:relative; overflow:hidden; background:var(--ink); font-family:'Space Grotesk', sans-serif; color:var(--white); }
  .abs { position:absolute; left:0; top:0; will-change:transform, opacity; }
  .scene { position:absolute; inset:0; overflow:hidden; display:none; }
  .grid { position:absolute; inset:-200px; background-image:linear-gradient(rgba(167,139,250,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(167,139,250,.07) 1px, transparent 1px); background-size:90px 90px; }
  .blob { position:absolute; border-radius:50%; filter:blur(90px); }
  .grain { position:absolute; inset:-50%; opacity:.09; mix-blend-mode:overlay; pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .bgword { font-family:'Anton'; white-space:nowrap; color:transparent; -webkit-text-stroke:2px rgba(167,139,250,.16); line-height:1; text-transform:uppercase; }
  .head { font-family:'Anton'; text-transform:uppercase; line-height:.95; color:#fff; letter-spacing:.5px; }
  .head .line { display:block; white-space:nowrap; }
  .head .w { display:inline-block; margin-right:.22em; }
  .lime { color:var(--lime); } .violet { color:var(--violet); } .black { color:#0A0712; }
  .chip { display:flex; align-items:center; gap:14px; padding:16px 26px 16px 18px; border-radius:999px; white-space:nowrap;
    background:rgba(22,14,43,.72); border:1.5px solid rgba(167,139,250,.35); backdrop-filter:blur(16px); font-weight:600; box-shadow:0 18px 40px rgba(0,0,0,.35); }
  .chip .ic { width:46px; height:46px; border-radius:50%; background:var(--lime); color:#0A0712; display:grid; place-items:center; }
  .chip svg, .ic svg { width:26px; height:26px; }
  svg.i { fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .browser { border-radius:20px; overflow:hidden; background:#fff; box-shadow:0 50px 100px rgba(0,0,0,.55), 0 0 0 1.5px rgba(167,139,250,.35); }
  .browser .bar { height:44px; background:#EEEAF7; display:flex; align-items:center; gap:9px; padding:0 18px; }
  .browser .bar i { width:13px; height:13px; border-radius:50%; background:#D4CCE8; display:block; }
  .browser .bar .url { margin-left:18px; height:26px; padding:0 16px; border-radius:13px; background:#fff; color:#6B5B95; font:600 14px 'Space Grotesk'; display:flex; align-items:center; }
  .browser img, .phone img { display:block; width:100%; }
  .phone { border-radius:58px; overflow:hidden; background:#111; padding:14px; box-shadow:0 50px 100px rgba(0,0,0,.55), 0 0 0 2px rgba(167,139,250,.4); }
  .phone .scr { border-radius:44px; overflow:hidden; background:#fff; }
  .toast { background:#fff; color:#0A0712; border-radius:28px; padding:26px 30px; display:flex; gap:22px; align-items:center; box-shadow:0 40px 80px rgba(0,0,0,.5); }
  .toast .t1 { font:700 24px 'Space Grotesk'; color:#16A34A; text-transform:uppercase; letter-spacing:1.5px; }
  .toast .amt { font:700 64px 'JetBrains Mono'; line-height:1.05; }
  .toast .t2 { font:500 22px 'Space Grotesk'; color:#6B6680; }
  .pdf { background:#fff; color:#0A0712; border-radius:18px; padding:30px; box-shadow:0 40px 90px rgba(0,0,0,.55); }
  .pdf .tag { position:absolute; right:-18px; top:-18px; background:var(--lime); color:#0A0712; font:700 26px 'Space Grotesk'; padding:8px 18px; border-radius:12px; transform:rotate(8deg); }
  .pdf h4 { font:700 30px 'Space Grotesk'; } .pdf .sub { font:500 18px 'Space Grotesk'; color:#7A7390; margin:4px 0 20px; }
  .pdf .row { display:flex; justify-content:space-between; font:600 22px 'Space Grotesk'; padding:12px 0; border-top:1px solid #EEE; }
  .pdf .barx { height:14px; border-radius:7px; margin-top:6px; }
  .pill { border-radius:999px; padding:18px 30px; font:700 30px 'Space Grotesk'; display:flex; gap:14px; align-items:center; white-space:nowrap; }
  .cta { background:var(--lime); color:#0A0712; border-radius:999px; font:700 46px 'Space Grotesk'; padding:26px 54px; display:inline-flex; gap:18px; align-items:center; box-shadow:0 0 0 10px rgba(198,255,61,.15), 0 30px 60px rgba(0,0,0,.4); white-space:nowrap; }
  .slab { position:absolute; top:-10%; height:120%; }
  .burst { position:absolute; border-radius:50%; background:repeating-conic-gradient(rgba(124,58,237,.35) 0 6deg, transparent 6deg 18deg); -webkit-mask:radial-gradient(circle, #000 20%, transparent 70%); mask:radial-gradient(circle, #000 20%, transparent 70%); }
  .marq { font-family:'Anton'; white-space:nowrap; text-transform:uppercase; line-height:1; }
  .logo { display:flex; align-items:center; gap:12px; font-family:'Anton'; letter-spacing:1px; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="icons.js"></script>
<script src="ad.js"></script>
</body>
</html>
